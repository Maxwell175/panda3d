name: Build C# Bindings NuGet Package

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version override (e.g. 1.11.1-preview.1). Leave blank to auto-derive.'
        required: false

jobs:
  thirdparty:
    name: Build Thirdparty
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04 }
          - { os: macOS-15 }
          - { os: windows-2022, crt: mt }
          - { os: windows-2022, crt: md }

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore thirdparty build cache
        id: cache-thirdparty-restore
        uses: actions/cache/restore@v5
        with:
          path: ./thirdparty
          key: cache-thirdparty-73384217d26c56aa9594e6d77c9b7c54f9c0d689-${{ matrix.crt || 'default' }}-v3-mimalloc343-${{ matrix.os }}

      - name: Install yasm
        if: runner.os != 'Windows' && steps.cache-thirdparty-restore.outputs.cache-hit != 'true'
        run: ${{runner.os == 'macOS' && 'brew' || 'sudo apt-get'}} install yasm

      - name: Clone thirdparty repository
        if: steps.cache-thirdparty-restore.outputs.cache-hit != 'true'
        run: git clone --revision=73384217d26c56aa9594e6d77c9b7c54f9c0d689 --depth=1 https://github.com/rdb/panda3d-thirdparty.git thirdparty

      - name: Patch thirdparty for MSVC /MT runtime
        if: steps.cache-thirdparty-restore.outputs.cache-hit != 'true' && matrix.crt == 'mt'
        shell: bash
        run: git -C thirdparty apply ../.github/patches/thirdparty-msvc-mt.patch

      # The thirdparty repo pins mimalloc v2.1.6 ("latest version to support CMake 3.13").
      # All CI runners ship CMake >= 3.18, so build the latest mimalloc (v3.4.3) instead.
      - name: Use latest mimalloc in thirdparty build
        if: steps.cache-thirdparty-restore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          OLD=6141843614220c4d85f55774c131a68ba778e413
          NEW=442e5fa3ea72709ed2ee0c29fd289fe15f6f7318
          sed -i.bak "s|GIT_TAG ${OLD} # v2.1.6|GIT_TAG ${NEW} # v3.4.3|" thirdparty/CMakeLists.txt
          rm -f thirdparty/CMakeLists.txt.bak
          grep -q "GIT_TAG ${NEW}" thirdparty/CMakeLists.txt || { echo "::error::mimalloc tag not bumped — the thirdparty pin may have changed"; exit 1; }
          grep -n -A1 'mimalloc.git' thirdparty/CMakeLists.txt

      - name: Configure
        if: steps.cache-thirdparty-restore.outputs.cache-hit != 'true'
        working-directory: thirdparty
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_NVIDIACG=OFF
          -DBUILD_FFMPEG=OFF
          -DBUILD_FCOLLADA=OFF
          -DBUILD_ARTOOLKIT=OFF

      - name: Build
        if: steps.cache-thirdparty-restore.outputs.cache-hit != 'true'
        working-directory: thirdparty
        run: cmake --build build --config Release -j4

      - name: Clean up build directory
        if: steps.cache-thirdparty-restore.outputs.cache-hit != 'true'
        working-directory: thirdparty
        shell: bash
        run: rm -rf build

      - name: Save thirdparty build cache
        id: cache-thirdparty-save
        if: steps.cache-thirdparty-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ./thirdparty
          key: ${{ steps.cache-thirdparty-restore.outputs.cache-primary-key }}

      - name: List thirdparty contents
        working-directory: thirdparty
        shell: bash
        run: ls -lAhR

  # Stage 1 — Build Panda3D native libraries (8 parallel jobs)
  build-panda3d:
    name: panda3d / ${{ matrix.rid }} / ${{ matrix.link }}
    runs-on: ${{ matrix.os }}
    needs: thirdparty

    strategy:
      fail-fast: false
      matrix:
        os:   [ubuntu-24.04, windows-2022]
        link: [shared, static]
        include:
          - { os: ubuntu-24.04, rid: linux-x64,  thirdparty_dir: linux-libs-x64    }
          - { os: windows-2022, rid: win-x64,    thirdparty_dir: win-libs-vc14-x64 }
          - { os: windows-2022, link: shared, thirdparty_crt: md }
          - { os: windows-2022, link: static, thirdparty_crt: mt }
          - { os: macOS-15, link: shared, rid: osx-x64,   thirdparty_dir: darwin-libs-a, cmake_osx_arch: x86_64 }
          - { os: macOS-15, link: static, rid: osx-x64,   thirdparty_dir: darwin-libs-a, cmake_osx_arch: x86_64 }
          - { os: macOS-15, link: shared, rid: osx-arm64, thirdparty_dir: darwin-libs-a, cmake_osx_arch: arm64  }
          - { os: macOS-15, link: static, rid: osx-arm64, thirdparty_dir: darwin-libs-a, cmake_osx_arch: arm64  }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Restore thirdparty build cache
        id: cache-thirdparty-restore
        uses: actions/cache/restore@v5
        with:
          path: ./thirdparty
          key: cache-thirdparty-73384217d26c56aa9594e6d77c9b7c54f9c0d689-${{ matrix.thirdparty_crt || 'default' }}-v3-mimalloc343-${{ matrix.os }}
          fail-on-cache-miss: true

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build bison flex patchelf \
            libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxext-dev \
            libsm-dev libice-dev \
            libgtk-3-dev

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          NINJA_VER=1.12.1
          CMAKE_VER=3.29.6
          curl -fsSL "https://github.com/ninja-build/ninja/releases/download/v${NINJA_VER}/ninja-mac.zip" \
            -o /tmp/ninja.zip
          sudo unzip -o /tmp/ninja.zip -d /usr/local/bin ninja
          sudo chmod +x /usr/local/bin/ninja
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-macos-universal.tar.gz" \
            -o /tmp/cmake.tar.gz
          tar xzf /tmp/cmake.tar.gz -C /tmp
          sudo mv "/tmp/cmake-${CMAKE_VER}-macos-universal/CMake.app" /Applications/CMake.app
          echo "/Applications/CMake.app/Contents/bin" >> "$GITHUB_PATH"
          sudo rm -rf /opt/homebrew

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: choco install winflexbison3 ninja --yes

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        # Shared builds are configured Standard (the default engine profile: debug
        # features like collision recording / PStats are compiled in) so the Debug
        # binding variant's extra P/Invokes resolve at runtime. Static builds are
        # Release (lean, NDEBUG) — they back the NativeAOT-safe Release variant.
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.link == 'shared' && 'Standard' || 'Release' }} \
            -DBUILD_SHARED_LIBS=${{ matrix.link == 'shared' && 'ON' || 'OFF' }} \
            -DUSE_MEMORY_MIMALLOC=ON \
            -DINTERROGATE_CSHARP_INTERFACE=ON \
            -DBUILD_INTERROGATE=ON \
            -DHAVE_PYTHON=NO \
            -DBUILD_METALIBS=YES \
            -DDEFAULT_PRC_DIR="<auto>etc"

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.link == 'shared' && 'Standard' || 'Release' }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_osx_arch }} \
            -DBUILD_SHARED_LIBS=${{ matrix.link == 'shared' && 'ON' || 'OFF' }} \
            -DUSE_MEMORY_MIMALLOC=ON \
            -DINTERROGATE_CSHARP_INTERFACE=ON \
            -DBUILD_INTERROGATE=ON \
            -DHAVE_PYTHON=NO \
            -DBUILD_METALIBS=YES \
            -DDEFAULT_PRC_DIR="<auto>etc"

      # Ninja + MSVC parallelizes across all cores, unlike the serial MSBuild the Visual
      # Studio generator used (which made Windows a ~1h outlier). Enter-VsDevShell puts
      # cl.exe / INCLUDE / LIB on PATH for this step; configure and build run together here
      # because that environment does not persist to later steps. Ninja is single-config, so
      # outputs land in build/{bin,lib} (not build/<config>/...) — see the collect steps.
      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $installPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $installPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cmake -B build `
            -G Ninja `
            "-DCMAKE_BUILD_TYPE=${{ matrix.link == 'shared' && 'Standard' || 'Release' }}" `
            "-DBUILD_SHARED_LIBS=${{ matrix.link == 'shared' && 'ON' || 'OFF' }}" `
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=${{ matrix.link == 'static' && 'MultiThreaded' || 'MultiThreadedDLL' }}" `
            -DUSE_MEMORY_MIMALLOC=ON `
            -DINTERROGATE_CSHARP_INTERFACE=ON `
            -DBUILD_INTERROGATE=ON `
            -DHAVE_PYTHON=NO `
            -DBUILD_METALIBS=YES `
            '-DDEFAULT_PRC_DIR=<auto>etc'
          cmake --build build

      - name: Build
        if: runner.os != 'Windows'
        # Single-config Ninja takes its build type from CMAKE_BUILD_TYPE; --config is ignored.
        run: cmake --build build --config ${{ matrix.link == 'shared' && 'Standard' || 'Release' }}

      - name: Patch shared library metadata
        if: runner.os != 'Windows' && matrix.link == 'shared'
        run: python3 cmake/scripts/patch_native_libs.py build

      # Collect native libraries.
      # For static builds we also bundle thirdparty static archives so NativeAOT
      # consumers can link without any separately-installed packages.
      - name: Collect native libs (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          if [ "${{ matrix.link }}" = "static" ]; then
            find thirdparty/${{ matrix.thirdparty_dir }} -name "*.a" \
              -exec cp -n {} dist/ \; 2>/dev/null || true
          fi
          # Only shared builds provide .so files. Static builds still produce MODULE
          # .so files (CMake MODULE libraries ignore BUILD_SHARED_LIBS), and those
          # have panda code statically linked inside — they must not overwrite the
          # shared-build versions that link against libpanda.so at runtime.
          if [ "${{ matrix.link }}" = "shared" ]; then
            find build -maxdepth 4 -name "*.so" \
              ! -name "*igate*" ! -name "*supplemental*" \
              -exec cp -n {} dist/ \; 2>/dev/null || true
          fi
          find build -maxdepth 4 -name "*.a" \
            ! -name "*igate*" \
            -exec cp -n {} dist/ \; 2>/dev/null || true
          echo "--- collected ---" && ls -la dist/

      - name: Collect native libs (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          if [ "${{ matrix.link }}" = "static" ]; then
            find thirdparty/${{ matrix.thirdparty_dir }} -name "*.a" \
              -exec cp -n {} dist/ \; 2>/dev/null || true
          fi
          # Only shared builds provide .dylib files (same reason as Linux above).
          if [ "${{ matrix.link }}" = "shared" ]; then
            find build -maxdepth 4 -name "*.dylib" \
              ! -name "*.[0-9]*.dylib" \
              ! -name "*igate*" ! -name "*supplemental*" \
              -exec cp -n {} dist/ \; 2>/dev/null || true
          fi
          find build -maxdepth 4 -name "*.a" \
            ! -name "*igate*" \
            -exec cp -n {} dist/ \; 2>/dev/null || true
          echo "--- collected ---" && ls -la dist/

      - name: Collect native libs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory -Force
          if ("${{ matrix.link }}" -eq "static") {
            Get-ChildItem -Recurse thirdparty\${{ matrix.thirdparty_dir }} -Filter '*.lib' |
              Copy-Item -Destination dist\ -ErrorAction SilentlyContinue
          }
          # Only shared builds provide DLLs. Static builds still produce MODULE DLLs
          # (CMake MODULE libraries ignore BUILD_SHARED_LIBS), and those have panda
          # code statically linked inside — they must not overwrite the shared-build
          # DLLs that load panda.dll at runtime.
          if ("${{ matrix.link }}" -eq "shared") {
            Get-ChildItem -Recurse build -Filter '*.dll' |
              Where-Object { $_.Name -notmatch 'igate' } |
              Copy-Item -Destination dist\ -ErrorAction SilentlyContinue
            if (Test-Path dist\pandaegg.dll) {
              Copy-Item dist\pandaegg.dll dist\libpandaegg.dll
            }
          }
          # Only pull *.lib files from static builds.
          if ("${{ matrix.link }}" -eq "static") {
            # Non-recursive: only the CMake archive output dir, not per-target
            # OBJECT-library intermediates that duplicate
            # the metalib archives.
            Get-ChildItem build\lib -Filter '*.lib' |
              Where-Object { $_.Name -notmatch 'igate' } |
              Copy-Item -Destination dist\ -ErrorAction SilentlyContinue
          }
          Get-ChildItem dist\

      - uses: actions/upload-artifact@v4
        with:
          name: panda3d-native-${{ matrix.rid }}-${{ matrix.link }}
          path: dist/
          if-no-files-found: error

      # Collect the tools into a self-contained per-RID bundle: the executables
      # (minus internal benchmarks) plus the Panda shared libs they load. Shared
      # build only — patch_native_libs.py above already made the exes relocatable.
      - name: Collect tools bundle (Linux/macOS)
        if: runner.os != 'Windows' && matrix.link == 'shared'
        shell: bash
        run: |
          mkdir tools-dist
          for f in build/bin/*; do
            [ -f "$f" ] && [ -x "$f" ] || continue
            case "$(basename "$f")" in
              cycler_bench|ebr_cycler|scenegraph_bench|scenegraph_stress) continue ;;
            esac
            cp "$f" tools-dist/
          done
          ext=$([ "${{ runner.os }}" = "macOS" ] && echo dylib || echo so)
          find build -maxdepth 4 -name "*.${ext}" \
            ! -name "*igate*" ! -name "*supplemental*" \
            -exec cp -n {} tools-dist/ \; 2>/dev/null || true
          echo "--- tools bundle ---" && ls -la tools-dist/

      - name: Collect tools bundle (Windows)
        if: runner.os == 'Windows' && matrix.link == 'shared'
        shell: pwsh
        run: |
          New-Item tools-dist -ItemType Directory -Force
          # Single-config Ninja emits the exes + their DLLs under build\bin.
          Get-ChildItem build\bin -Filter *.exe |
            Where-Object { $_.BaseName -notmatch '^(cycler_bench|ebr_cycler|scenegraph_bench|scenegraph_stress)$' } |
            Copy-Item -Destination tools-dist\
          Get-ChildItem build\bin -Filter *.dll |
            Where-Object { $_.Name -notmatch 'igate' -and $_.Name -notmatch 'supplemental' } |
            Copy-Item -Destination tools-dist\ -ErrorAction SilentlyContinue
          Get-ChildItem tools-dist\

      - name: Upload tools bundle
        if: matrix.link == 'shared'
        uses: actions/upload-artifact@v4
        with:
          name: panda3d-tools-${{ matrix.rid }}
          path: tools-dist/
          if-no-files-found: error

      # Read the Version from Interrogate.Core.csproj and derive major.minor.*
      # so the packed Panda3D.nupkg requires a compatible Interrogate.Core from NuGet.
      - name: Extract Interrogate.Core version range
        if: matrix.rid == 'linux-x64' && matrix.link == 'shared'
        run: |
          CSPROJ="build/interrogate/src/panda3d-interrogate/csharp/Interrogate.Core/Interrogate.Core.csproj"
          VER=$(grep '<Version>' "$CSPROJ" | sed 's|.*<Version>\(.*\)</Version>.*|\1|' | tr -d '[:space:]')
          MAJOR_MINOR=$(echo "$VER" | cut -d. -f1,2)
          mkdir igate-ver
          echo "${MAJOR_MINOR}.*" > igate-ver/igate-core-ver.txt
          echo "Interrogate.Core version range: ${MAJOR_MINOR}.*"

      - uses: actions/upload-artifact@v4
        if: matrix.rid == 'linux-x64' && matrix.link == 'shared'
        with:
          name: interrogate-core-version
          path: igate-ver/igate-core-ver.txt
          if-no-files-found: error

      # Two binding surfaces are generated, one per config: the Standard (shared)
      # build emits the full surface (debug-feature methods included) that backs the
      # Debug Interop variant; the Release (static) build emits the lean, AOT-safe
      # surface that backs the Release variant. Both are packed later into one package.
      - name: Upload C# sources
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: panda3d-csharp-sources-${{ matrix.link == 'shared' && 'standard' || 'release' }}
          path: build/csharp/
          if-no-files-found: error

  # Stage 2 — Pack per-RID runtime packages and the managed interop package
  pack-nuget:
    name: Pack NuGet Packages
    runs-on: ubuntu-24.04
    needs: build-panda3d

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed to count commits since v1.10.0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - uses: actions/download-artifact@v4
        with:
          pattern: 'panda3d-*'
          path: artifacts/
          merge-multiple: false

      - uses: actions/download-artifact@v4
        with:
          name: interrogate-core-version
          path: artifacts/interrogate-core-version/

      # Assemble per-RID native directories
      - name: Assemble runtimes directories
        run: |
          for rid in linux-x64 win-x64 osx-x64 osx-arm64; do
            mkdir -p "runtimes/$rid/native"
            for link in shared static; do
              src="artifacts/panda3d-native-${rid}-${link}"
              [ -d "$src" ] && cp "$src"/* "runtimes/$rid/native/" 2>/dev/null || true
            done
          done
          echo "=== runtimes layout ==="
          find runtimes -type f | sort

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            COMMITS=$(git rev-list --count v1.10.0..HEAD)
            V="1.11.0-preview.${COMMITS}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Pack one Panda3D.Runtime.{rid} package per RID
      - name: Pack runtime packages
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          for rid in linux-x64 win-x64 osx-x64 osx-arm64; do
            nativedir="${{ github.workspace }}/runtimes/$rid/native"
            [ -d "$nativedir" ] || continue
            dotnet pack csharp/Panda3D.Runtime.csproj \
              -c Release \
              -p:Rid="$rid" \
              -p:Version="$VERSION" \
              -p:NativeDir="$nativedir" \
              -o nupkg/
          done

      - name: List runtime package contents
        run: |
          for pkg in nupkg/Panda3D.Runtime.*.nupkg; do
            echo "=== $(basename "$pkg") ==="
            unzip -l "$pkg" | grep -E '\.so|\.dll|\.dylib|\.a|\.lib|\.targets' | sort
          done

      # Pack the managed Panda3D.Interop package. It ships two assemblies with
      # different API surfaces, so we compile Panda3D.Interop.csproj twice — once
      # against the Standard binding sources (the full Debug variant) and once
      # against the Release sources (the lean, AOT-safe variant) — then bundle both
      # via Panda3D.Interop.Package.csproj. Distinct intermediate dirs keep the two
      # compilations from sharing obj/ and cross-contaminating.
      - name: Pack Panda3D.Interop
        run: |
          IGATE_VER_RANGE=$(cat artifacts/interrogate-core-version/igate-core-ver.txt)
          VERSION="${{ steps.ver.outputs.version }}"

          dotnet build csharp/Panda3D.Interop.csproj \
            -c Release \
            -p:GeneratedSourcesDir="${{ github.workspace }}/artifacts/panda3d-csharp-sources-standard" \
            -p:InterrogateCoreVersion="$IGATE_VER_RANGE" \
            -p:IntermediateOutputPath=obj/variant-standard/ \
            -o "${{ github.workspace }}/interop-debug"

          dotnet build csharp/Panda3D.Interop.csproj \
            -c Release \
            -p:GeneratedSourcesDir="${{ github.workspace }}/artifacts/panda3d-csharp-sources-release" \
            -p:InterrogateCoreVersion="$IGATE_VER_RANGE" \
            -p:IntermediateOutputPath=obj/variant-release/ \
            -o "${{ github.workspace }}/interop-release"

          dotnet pack csharp/Panda3D.Interop.Package.csproj \
            -c Release \
            -p:Version="$VERSION" \
            -p:DebugInteropDll="${{ github.workspace }}/interop-debug/Panda3D.Interop.dll" \
            -p:ReleaseInteropDll="${{ github.workspace }}/interop-release/Panda3D.Interop.dll" \
            -p:InterrogateCoreVersion="$IGATE_VER_RANGE" \
            -o nupkg/

      - name: List interop package contents
        run: unzip -l nupkg/Panda3D.Interop.*.nupkg | sort

      # Assemble each platform's tool bundle under tools/<rid>/ and pack the single
      # cross-platform Panda3D.Tools package (Grpc.Tools-style: all RIDs in one
      # package, host-selected at build time by the shipped targets).
      - name: Assemble tools directories
        run: |
          for rid in linux-x64 win-x64 osx-x64 osx-arm64; do
            src="artifacts/panda3d-tools-${rid}"
            [ -d "$src" ] || continue
            mkdir -p "tools/$rid"
            cp "$src"/* "tools/$rid/" 2>/dev/null || true
            chmod +x "tools/$rid/"* 2>/dev/null || true
          done
          echo "=== tools layout ===" && find tools -type f | sort | sed -n '1,60p'
          echo "=== per-rid counts ===" && for d in tools/*/; do echo "$d $(ls "$d" | wc -l) files"; done

      # Compile the MSBuild task assembly (one task per pipeline tool) that ships in
      # the package; the pack step below includes its DLL under tasks/netstandard2.0/.
      - name: Build Panda3D.Tools.Tasks
        run: dotnet build csharp/Panda3D.Tools.Tasks/Panda3D.Tools.Tasks.csproj -c Release

      - name: Pack Panda3D.Tools
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          dotnet pack csharp/Panda3D.Tools.csproj \
            -c Release \
            -p:Version="$VERSION" \
            -p:ToolsDir="${{ github.workspace }}/tools" \
            -p:TasksDll="${{ github.workspace }}/csharp/Panda3D.Tools.Tasks/bin/Release/netstandard2.0/Panda3D.Tools.Tasks.dll" \
            -o nupkg/

      - name: List tools package contents
        run: unzip -l nupkg/Panda3D.Tools.*.nupkg | sort | sed -n '1,80p'

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: nupkg/*.nupkg
